<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Stránka nenalezena — SecureAgents</title>
    <style>
      :root { --ink: #f1ece1; --panel: #ffffff; --line: #8d8369; --text: #15181d; --muted: #5a5952; --amber: #e8a33d; --on-amber: #181206; color-scheme: light; }
      @media (prefers-color-scheme: dark) { :root { --ink: #12161c; --panel: #1a2029; --line: #313a47; --text: #edeff2; --muted: #97a1ad; --amber: #e8a33d; --on-amber: #181206; color-scheme: dark; } }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--ink); color: var(--text); font-family: Arial, sans-serif; }
      main { max-width: 560px; padding: 32px; border: 1px solid var(--line); background: var(--panel); text-align: center; }
      p { color: var(--muted); } a { display: inline-block; margin-top: 16px; padding: 12px 18px; background: var(--amber); color: var(--on-amber); text-decoration: none; font-weight: bold; }
    </style>
  </head>
  <body><main><p>CHYBA 404</p><h1>Tahle stránka neexistuje.</h1><p>Možná byla přesunuta nebo odkaz není správný.</p><a href="/">Zpět na hlavní stránku</a></main></body>
</html>
